name: Build Windows Simulator

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build pc_hcpu simulator
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build simulator
        shell: powershell
        run: |
          if (-not $env:SIFLI_SDK) {
            throw "Set SIFLI_SDK in the self-hosted runner environment."
          }
          & .\firmware\hk10promax\run_simulator_windows.ps1 -BuildOnly
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "Simulator build failed with exit code $LASTEXITCODE."
          }

      - name: Publish Windows simulator to firmware folder
        shell: powershell
        run: |
          $Source = Join-Path $PWD "firmware\hk10promax\project\build_pc_hcpu"
          $Executable = Join-Path $Source "main.exe"
          if (-not (Test-Path -LiteralPath $Executable -PathType Leaf)) {
            throw "Simulator executable was not produced: $Executable"
          }

          $Destination = Join-Path $PWD "firmware\builds\windows-simulator"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $env:GITHUB_REF_NAME
          git reset --hard "origin/$env:GITHUB_REF_NAME"
          if (Test-Path -LiteralPath $Destination) {
            Remove-Item -LiteralPath $Destination -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $Destination | Out-Null
          Get-ChildItem -LiteralPath $Source -File | Where-Object {
            $_.Extension -in @(".exe", ".dll")
          } | Copy-Item -Destination $Destination -Force

          git add -f firmware/builds/windows-simulator
          if (git diff --cached --quiet) {
            Write-Host "Windows simulator output is unchanged."
          }
          else {
            git commit -m "[skip ci] Publish Windows simulator to firmware"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
