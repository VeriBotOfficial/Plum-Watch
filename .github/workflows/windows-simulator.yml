name: Build Windows Simulator

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build pc_hcpu simulator
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Cache SiFli toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~\.sifli
            ~\.cache\uv
          key: sifli-v2.4-windows-${{ runner.arch }}-v1
          restore-keys: |
            sifli-v2.4-windows-${{ runner.arch }}-

      - name: Install SiFli SDK
        shell: pwsh
        run: |
          $Sdk = Join-Path $env:RUNNER_TEMP "SiFli-SDK"
          git clone --depth 1 --branch release/v2.4 --recurse-submodules --shallow-submodules https://github.com/OpenSiFli/SiFli-SDK $Sdk
          if ($LASTEXITCODE -ne 0) { throw "SiFli SDK checkout failed." }
          $env:SIFLI_SDK = $Sdk
          Push-Location $Sdk
          try {
            & .\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "SiFli SDK toolchain installation failed." }
          }
          finally {
            Pop-Location
          }
          "SIFLI_SDK=$Sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows simulator
        shell: pwsh
        run: |
          & .\firmware\hk10promax\run_simulator_windows.ps1 -BuildOnly
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "Simulator build failed with exit code $LASTEXITCODE."
          }

      - name: Publish Windows simulator to firmware folder
        shell: pwsh
        run: |
          $Source = Join-Path $PWD "firmware\hk10promax\project\build_pc_hcpu"
          if (-not (Test-Path -LiteralPath (Join-Path $Source "main.exe") -PathType Leaf)) {
            throw "Simulator executable was not produced in $Source."
          }
          $Destination = Join-Path $PWD "firmware\builds\windows-simulator"

          if (Test-Path -LiteralPath $Destination) {
            Remove-Item -LiteralPath $Destination -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $Destination | Out-Null
          Get-ChildItem -LiteralPath $Source -Force | Copy-Item -Destination $Destination -Recurse -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f firmware/builds/windows-simulator
          if (git diff --cached --quiet) {
            Write-Host "Windows simulator output is unchanged."
          }
          else {
            git commit -m "[skip ci] Publish Windows simulator"
            git fetch origin $env:GITHUB_REF_NAME
            git rebase "origin/$env:GITHUB_REF_NAME"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
