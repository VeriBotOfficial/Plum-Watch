name: Build Windows Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build pc_hcpu simulator
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build simulator
        shell: powershell
        run: |
          if (-not $env:SIFLI_SDK) {
            throw "Set SIFLI_SDK in the self-hosted runner environment."
          }
          & .\firmware\hk10promax\run_simulator_windows.ps1 -BuildOnly
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "Simulator build failed with exit code $LASTEXITCODE."
          }

      - name: Upload Windows simulator
        uses: actions/upload-artifact@v4
        with:
          name: plum-watch-windows-simulator
          path: firmware/hk10promax/project/build_pc_hcpu/main.exe
          if-no-files-found: error
          retention-days: 14
