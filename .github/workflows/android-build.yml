
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Compute yearly app version
        shell: bash
        run: |
          git fetch origin main
          VERSION_YEAR="$(TZ=Europe/Istanbul date +%y)"
          PREVIOUS_VERSION="$(git show origin/main:app/android/build/update.json 2>/dev/null | jq -r '.versionName // empty' || true)"
          MINOR=0
          PATCH=1

          if [[ "$PREVIOUS_VERSION" =~ ^([0-9]{2})\.([0-9]+)\.([0-9]+)$ ]]; then
            PREVIOUS_YEAR="${BASH_REMATCH[1]}"
            if [ "$PREVIOUS_YEAR" = "$VERSION_YEAR" ]; then
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              PATCH=$((PATCH + 1))
              if [ "$PATCH" -ge 10 ]; then
                MINOR=$((MINOR + 1))
                PATCH=0
              fi
            fi
          fi

          VERSION_NAME="$VERSION_YEAR.$MINOR.$PATCH"
          echo "PLUM_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building Plum Watch $VERSION_NAME (version code $GITHUB_RUN_NUMBER)"

      - name: Prepare persistent APK signing key
        id: signing
        env:
          PLUM_SIGNING_KEYSTORE_BASE64: ${{ secrets.PLUM_SIGNING_KEYSTORE_BASE64 }}
          PLUM_SIGNING_STORE_PASSWORD: ${{ secrets.PLUM_SIGNING_STORE_PASSWORD }}
          PLUM_SIGNING_KEY_ALIAS: ${{ secrets.PLUM_SIGNING_KEY_ALIAS }}
          PLUM_SIGNING_KEY_PASSWORD: ${{ secrets.PLUM_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$PLUM_SIGNING_KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent signing secrets are missing. The APK will be saved, but not published as an app update."
            exit 0
          fi

          if [ -z "$PLUM_SIGNING_STORE_PASSWORD" ] || [ -z "$PLUM_SIGNING_KEY_ALIAS" ] || [ -z "$PLUM_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::The signing keystore is present, but one or more signing secrets are missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/plum-watch-release.jks"
          printf '%s' "$PLUM_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PLUM_SIGNING_STORE_PASSWORD" -alias "$PLUM_SIGNING_KEY_ALIAS" >/dev/null
          echo "PLUM_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          PLUM_VERSION_CODE: ${{ github.run_number }}
          PLUM_SIGNING_STORE_PASSWORD: ${{ secrets.PLUM_SIGNING_STORE_PASSWORD }}
          PLUM_SIGNING_KEY_ALIAS: ${{ secrets.PLUM_SIGNING_KEY_ALIAS }}
          PLUM_SIGNING_KEY_PASSWORD: ${{ secrets.PLUM_SIGNING_KEY_PASSWORD }}
        working-directory: app/android
        run: sh ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publish APK to firmware folder
        if: github.ref == 'refs/heads/main'
        env:
          STABLE_SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          APK_FILE="$RUNNER_TEMP/plum-watch-debug.apk"
          UPDATE_FILE="$RUNNER_TEMP/update.json"
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p firmware/builds/android
          cp "$APK_FILE" firmware/builds/android/plum-watch-debug.apk
          git add -f firmware/builds/android/plum-watch-debug.apk

          if [ "$STABLE_SIGNING_CONFIGURED" = "true" ]; then
            VERSION_NAME="$PLUM_VERSION_NAME"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
            SHA256=$(sha256sum "$APK_FILE" | cut -d " " -f 1)
            APK_SIZE_BYTES=$(stat -c%s "$APK_FILE")
            cat > "$UPDATE_FILE" <<EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "https://raw.githubusercontent.com/VeriBotOfficial/Plum-Watch/main/firmware/builds/android/plum-watch-debug.apk",
            "apkSizeBytes": $APK_SIZE_BYTES,
            "sha256": "$SHA256"
          }
          EOF
            cp "$UPDATE_FILE" app/android/build/update.json
            git add -f app/android/build/update.json
          fi

          if git diff --cached --quiet; then
            echo "Published APK is unchanged; no repository update needed."
          else
            git commit -m "[skip ci] Publish Android APK to firmware"
            git push origin HEAD:main
          fi

      - name: Report signing setup
        if: success() && steps.signing.outputs.configured != 'true'
        run: |
          echo "The APK was saved under firmware/builds/android."
          echo "Configure the four PLUM_SIGNING_* repository secrets to publish it as an app update."
