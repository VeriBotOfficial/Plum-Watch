name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Prepare persistent APK signing key
        id: signing
        env:
          PLUM_SIGNING_KEYSTORE_BASE64: ${{ secrets.PLUM_SIGNING_KEYSTORE_BASE64 }}
          PLUM_SIGNING_STORE_PASSWORD: ${{ secrets.PLUM_SIGNING_STORE_PASSWORD }}
          PLUM_SIGNING_KEY_ALIAS: ${{ secrets.PLUM_SIGNING_KEY_ALIAS }}
          PLUM_SIGNING_KEY_PASSWORD: ${{ secrets.PLUM_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$PLUM_SIGNING_KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent signing secrets are missing. Build will be validated, but this APK will not be published."
            exit 0
          fi

          if [ -z "$PLUM_SIGNING_STORE_PASSWORD" ] || [ -z "$PLUM_SIGNING_KEY_ALIAS" ] || [ -z "$PLUM_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::The signing keystore is present, but one or more signing secrets are missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/plum-watch-release.jks"
          printf '%s' "$PLUM_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$PLUM_SIGNING_STORE_PASSWORD" -alias "$PLUM_SIGNING_KEY_ALIAS" >/dev/null
          echo "PLUM_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          PLUM_VERSION_CODE: ${{ github.run_number }}
          PLUM_VERSION_NAME: 0.1.${{ github.run_number }}
          PLUM_SIGNING_STORE_PASSWORD: ${{ secrets.PLUM_SIGNING_STORE_PASSWORD }}
          PLUM_SIGNING_KEY_ALIAS: ${{ secrets.PLUM_SIGNING_KEY_ALIAS }}
          PLUM_SIGNING_KEY_PASSWORD: ${{ secrets.PLUM_SIGNING_KEY_PASSWORD }}
        working-directory: app/android
        run: sh ./gradlew --no-daemon assembleDebug

      - name: Publish latest APK to repository
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        run: |
          mkdir -p app/android/build
          cp app/android/app/build/outputs/apk/debug/app-debug.apk app/android/build/plum-watch-debug.apk
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          SHA256=$(sha256sum app/android/build/plum-watch-debug.apk | cut -d " " -f 1)
          cat > app/android/build/update.json <<EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "https://raw.githubusercontent.com/VeriBotOfficial/Plum-Watch/main/app/android/build/plum-watch-debug.apk",
            "sha256": "$SHA256"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/android/build/plum-watch-debug.apk app/android/build/update.json
          if git diff --cached --quiet; then
            echo "APK is unchanged; no repository update needed."
          else
            git commit -m "[skip ci] Publish latest Android APK"
            git push
          fi

      - name: Upload stable debug APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plum-watch-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report signing setup
        if: steps.signing.outputs.configured != 'true'
        run: |
          echo "Build compilation succeeded, but no installable update was published."
          echo "Add the four PLUM_SIGNING_* repository secrets, then run this workflow manually."
