name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: app/android
        run: sh ./gradlew --no-daemon assembleDebug

      - name: Publish latest APK to repository
        run: |
          mkdir -p app/android/build
          cp app/android/app/build/outputs/apk/debug/app-debug.apk app/android/build/plum-watch-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android/build/plum-watch-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no repository update needed."
          else
            git commit -m "[skip ci] Publish latest Android APK"
            git push
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plum-watch-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
