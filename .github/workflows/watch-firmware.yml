name: Build Watch Firmware

on:
  workflow_dispatch:
    inputs:
      add_disk:
        description: Include the optional filesystem disk image
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build eh-lb525 watch firmware
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SIFLI_SDK_SHELL: pwsh.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Resolve SiFli SDK revision
        id: sdk
        run: |
          $remote = git ls-remote --exit-code https://github.com/OpenSiFli/SiFli-SDK refs/heads/release/v2.4
          if ($LASTEXITCODE -ne 0 -or -not $remote) { throw "Could not resolve SiFli SDK release/v2.4." }
          $revision = (($remote | Select-Object -First 1) -split '\s+')[0]
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw "Invalid SiFli SDK revision: $revision" }
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache SiFli SDK and toolchain
        id: sifli-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\SiFli-SDK
            ~\.sifli
            ~\.cache\uv
          key: sifli-v2.4-windows-${{ runner.arch }}-${{ steps.sdk.outputs.revision }}
          restore-keys: |
            sifli-v2.4-windows-${{ runner.arch }}-

      - name: Install SiFli SDK
        id: install-sdk
        run: |
          $Sdk = Join-Path $env:USERPROFILE "SiFli-SDK"
          if ("${{ steps.sifli-cache.outputs.cache-hit }}" -eq "true") {
            if (-not (Test-Path -LiteralPath (Join-Path $Sdk "export.ps1"))) {
              throw "The restored SiFli SDK cache is incomplete."
            }
            $CachedRevision = (& git -C $Sdk rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $CachedRevision -ne "${{ steps.sdk.outputs.revision }}") {
              throw "The restored SiFli SDK cache does not match the resolved SDK revision."
            }
            Write-Host "[SiFli] Reusing cached SDK and installed toolchain."
          }
          else {
            if (Test-Path -LiteralPath $Sdk) {
              Remove-Item -LiteralPath $Sdk -Recurse -Force
            }
            git clone --depth 1 --no-checkout https://github.com/OpenSiFli/SiFli-SDK $Sdk
            if ($LASTEXITCODE -ne 0) { throw "SiFli SDK checkout failed." }
            git -C $Sdk fetch --depth 1 origin "${{ steps.sdk.outputs.revision }}"
            if ($LASTEXITCODE -ne 0) { throw "SiFli SDK revision fetch failed." }
            git -C $Sdk checkout --detach "${{ steps.sdk.outputs.revision }}"
            if ($LASTEXITCODE -ne 0) { throw "SiFli SDK checkout failed." }
            git -C $Sdk submodule update --init --recursive --depth 1
            if ($LASTEXITCODE -ne 0) { throw "SiFli SDK submodule setup failed." }

            $env:SIFLI_SDK = $Sdk
            Push-Location $Sdk
            try {
              & .\install.ps1
              if ($LASTEXITCODE -ne 0) { throw "SiFli SDK toolchain installation failed." }
            }
            finally {
              Pop-Location
            }
          }
          $env:SIFLI_SDK = $Sdk
          "SIFLI_SDK=$Sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save SiFli SDK and toolchain cache
        if: steps.install-sdk.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\\SiFli-SDK
            ~\\.sifli
          key: sifli-v2.4-windows-${{ runner.arch }}-${{ steps.sdk.outputs.revision }}

      - name: Build watch firmware
        run: |
          $arguments = @()
          if ("${{ inputs.add_disk }}" -eq "true") { $arguments += "-AddDisk" }
          & .\firmware\hk10promax\build_firmware_windows.ps1 @arguments
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "Watch firmware build failed with exit code $LASTEXITCODE."
          }

      - name: Publish watch firmware to firmware folder
        run: |
          $Project = Join-Path $PWD "firmware\hk10promax\project"
          $Destination = Join-Path $PWD "firmware\builds\watch-firmware"
          $Extensions = @(".bin", ".hex", ".ftab", ".img", ".dfu", ".fls", ".pack", ".zip")
          $BuildDirectories = Get-ChildItem -LiteralPath $Project -Directory | Where-Object {
            $_.Name -like "build*"
          }
          $ProjectRootFiles = Get-ChildItem -LiteralPath $Project -File
          $BuildFiles = $BuildDirectories | ForEach-Object {
            Get-ChildItem -LiteralPath $_.FullName -Recurse -File
          }
          $Outputs = @($ProjectRootFiles) + @($BuildFiles) | Where-Object {
            $Extensions -contains $_.Extension.ToLowerInvariant()
          }
          if (-not $Outputs) { throw "No watch firmware output files were found in $Project." }

          if (Test-Path -LiteralPath $Destination) {
            Remove-Item -LiteralPath $Destination -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $Destination | Out-Null
          foreach ($File in $Outputs) {
            $Relative = $File.FullName.Substring($Project.Length).TrimStart([char[]]@('\\', '/'))
            $Target = Join-Path $Destination $Relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $Target) | Out-Null
            Copy-Item -LiteralPath $File.FullName -Destination $Target -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f firmware/builds/watch-firmware
          if (git diff --cached --quiet) {
            Write-Host "Watch firmware output is unchanged."
          }
          else {
            git commit -m "[skip ci] Publish watch firmware"
            git fetch origin $env:GITHUB_REF_NAME
            git rebase "origin/$env:GITHUB_REF_NAME"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
