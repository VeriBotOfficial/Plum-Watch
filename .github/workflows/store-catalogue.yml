name: Publish Store catalogue

on:
  push:
    branches: [main]
    paths:
      - "store/watchfaces/*.zip"
      - "store/apps/**"
      - "store/**"
      - "scripts/build_store_catalog.py"
      - "scripts/ezip_preview.py"
      - ".github/workflows/store-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-catalogue
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install preview tooling
        run: python -m pip install --upgrade Pillow
      - name: Inspect SiFli watchface layout metadata
