          PY
          for f in /tmp/*.so; do :; done
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('store/watchfaces/Red John.zip') as z:
              for n in z.namelist():
                  if n.endswith('.so'):
                      out='/tmp/'+n.rsplit('/',1)[-1]
