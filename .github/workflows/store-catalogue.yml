name: Publish Store catalogue

on:
  push:
    branches: [main]
    paths:
      - "store/watchfaces/*.zip"
      - "store/apps/**"
      - "store/**"
      - "scripts/build_store_catalog.py"
      - "scripts/ezip_preview.py"
      - "scripts/inspect_sifli_watchface.py"
      - ".github/workflows/store-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-catalogue
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install preview tooling
        run: python -m pip install --upgrade Pillow
      - name: Inspect SiFli watchface layout metadata
        run: python scripts/inspect_sifli_watchface.py
      - name: Validate ZIPs and generate catalogue/previews
        run: python scripts/build_store_catalog.py --write
      - name: Commit generated catalogue and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/index.json
          if [ -d store/generated/previews ]; then
            git add store/generated/previews
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(store): publish catalogue and previews [skip ci]"
            git push
          fi
