                      data = z.read(name)
                      print('DSC', name, 'len=', len(data), 'repr=', repr(data), 'hex=', data.hex())
                  elif name.endswith('.so'):
                      data = z.read(name)
                      print('SO', name, 'len=', len(data), 'ELF=', data[:64].hex())
                      strings = re.findall(rb'[ -~]{4,}', data)
                      print('STRINGS', [x.decode('ascii', 'replace') for x in strings])
                  elif '_time_num_' in name or re.search(r'_bg\\d*\\.bin        run: python scripts/build_store_catalog.py --write
