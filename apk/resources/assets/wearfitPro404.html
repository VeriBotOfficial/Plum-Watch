<head>

            name="viewport"

    <title>Wearfit Pro</title>

</head>
<body>
<div class="container">
    <div class="image-container">
        <img class="img-down" src="./h5_noInter.png" alt="步骤1"/>
        <div class="c-000">网页无法打开</div>
        <div class="noInter">
            网页无法加载，请检查网络
        </div>
    </div>
</div>
</body>

<script>
    window.addEventListener("load", () => {
	// 假设当前URL是 http://example.com?name=John&age=30
    const urlParams = new URLSearchParams(window.location.search);
    const language = urlParams.get('language'); // 获取name参数的值
	if(language === "en") {
	var noIntent = document.getElementsByClassName("noInter");
	noIntent[0].innerText  = "The webpage cannot be loaded, please check the network";
	var des = document.getElementsByClassName("c-000");
	des[0].innerText  = "The webpage cannot be opened";
	} 
	} )

</script>
