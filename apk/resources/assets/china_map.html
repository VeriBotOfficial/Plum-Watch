<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #FAFAFA; border-radius: 16px; }
  #map { width: 100%; height: 100%; }
  .legend {
    position: absolute; bottom: 6px; left: 12px;
    display: flex; gap: 12px; font-size: 10px; color: #999;
  }
  .legend-item { display: flex; align-items: center; gap: 3px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>
<div id="map"></div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#4CAF50"></div>已完成</div>
  <div class="legend-item"><div class="legend-dot" style="background:#FF6B35"></div>进行中</div>
  <div class="legend-item"><div class="legend-dot" style="background:#BDBDBD"></div>未开始</div>
</div>

<script src="echarts.min.js"></script>
<script>
var chart = echarts.init(document.getElementById('map'));

// 城市坐标
var cityGeo = {
  '北京': [116.40, 39.90], '上海': [121.47, 31.23],
  '广州': [113.26, 23.13], '深圳': [114.06, 22.55],
  '成都': [104.07, 30.57], '杭州': [120.15, 30.28],
  '西安': [108.94, 34.26], '武汉': [114.30, 30.59],
  '南京': [118.80, 32.06], '重庆': [106.55, 29.56],
  '长沙': [112.94, 28.23], '大连': [121.61, 38.91],
  '青岛': [120.38, 36.07], '厦门': [118.09, 24.48],
  '昆明': [102.83, 25.02], '哈尔滨': [126.63, 45.75],
  '拉萨': [91.11, 29.65], '乌鲁木齐': [87.62, 43.83],
  '沈阳': [123.43, 41.80], '天津': [117.20, 39.13],
  '苏州': [120.62, 31.30], '郑州': [113.65, 34.76],
  '贵阳': [106.63, 26.65], '南宁': [108.37, 22.82],
  '海口': [110.35, 20.02], '兰州': [103.83, 36.06],
};

// 加载本地地图JSON
var xhr = new XMLHttpRequest();
xhr.open('GET', 'china.json', true);
xhr.onload = function() {
  if (xhr.status === 200) {
    var geoJson = JSON.parse(xhr.responseText);
    echarts.registerMap('china', geoJson);
    // 地图加载完毕，显示空地图先
    renderMap([], [], []);
  }
};
xhr.send();

function renderMap(completed, inProgress, notStarted) {
  var series = [];

  if (completed.length > 0) {
    series.push({
      type: 'effectScatter',
      coordinateSystem: 'geo',
      data: completed,
      symbolSize: 14,
      showEffectOn: 'render',
      rippleEffect: { brushType: 'stroke', scale: 3, period: 4 },
      itemStyle: { color: '#4CAF50', shadowBlur: 10, shadowColor: '#4CAF50' },
      label: {
        show: true, position: 'top',
        formatter: function(p) { return p.data.name + ' ' + p.data.checked + '/' + p.data.total; },
        fontSize: 10, color: '#4CAF50', fontWeight: 'bold',
        textBorderColor: '#fff', textBorderWidth: 2
      }
    });
  }

  if (inProgress.length > 0) {
    series.push({
      type: 'effectScatter',
      coordinateSystem: 'geo',
      data: inProgress,
      symbolSize: 12,
      showEffectOn: 'render',
      rippleEffect: { brushType: 'stroke', scale: 4, period: 3 },
      itemStyle: { color: '#FF6B35', shadowBlur: 10, shadowColor: '#FF6B35' },
      label: {
        show: true, position: 'top',
        formatter: function(p) { return p.data.name + ' ' + p.data.checked + '/' + p.data.total; },
        fontSize: 10, color: '#FF6B35', fontWeight: 'bold',
        textBorderColor: '#fff', textBorderWidth: 2
      }
    });
  }

  if (notStarted.length > 0) {
    series.push({
      type: 'scatter',
      coordinateSystem: 'geo',
      data: notStarted,
      symbolSize: 8,
      itemStyle: { color: '#BDBDBD' },
      label: {
        show: true, position: 'top', formatter: '{b}',
        fontSize: 9, color: '#AAAAAA',
        textBorderColor: '#fff', textBorderWidth: 2
      }
    });
  }

  chart.setOption({
    backgroundColor: 'transparent',
    geo: {
      map: 'china',
      roam: false,
      zoom: 1.15,
      center: [105, 36],
      silent: true,
      label: { show: false },
      itemStyle: {
        areaColor: '#EEF1F5',
        borderColor: '#C9CDD4',
        borderWidth: 0.8
      },
      emphasis: { disabled: true }
    },
    series: series
  });
}

// Android 调用入口
window.setCityData = function(json) {
  try {
    var cities = JSON.parse(json);
    var completed = [], inProgress = [], notStarted = [];

    cities.forEach(function(c) {
      var geo = cityGeo[c.name];
      if (!geo) return;
      var item = { name: c.name, value: geo, checked: c.checked_points, total: c.total_points };
      if (c.completed) {
        completed.push(item);
      } else if (c.checked_points > 0) {
        inProgress.push(item);
      } else {
        notStarted.push(item);
      }
    });

    renderMap(completed, inProgress, notStarted);
  } catch(e) {
    console.error('setCityData error:', e);
  }
};

window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>
