<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:rgba(0,0,0,0)!important;background-color:transparent!important}
body{font-family:-apple-system,"PingFang SC",sans-serif;min-height:100vh}

/* 全屏弹窗 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:24px}
/* 隐藏时连半透明遮罩也不要参与合成，避免 resize 瞬间左上角闪一块底色 */
.overlay.hidden{opacity:0;pointer-events:none;background:transparent!important}

.popup{width:100%;max-width:340px;background:linear-gradient(180deg,#1a0a2e,#0d1b3e);border-radius:20px;overflow:visible;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.popup-header{text-align:center;padding:24px 20px 12px;position:relative}
.popup-tag{display:inline-block;background:linear-gradient(135deg,#FFD700,#FFA500);color:#1a0a2e;font-size:11px;font-weight:700;padding:3px 14px;border-radius:12px;margin-bottom:10px}
.popup-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.popup-desc{font-size:13px;color:#8899bb;line-height:1.5}
.popup-price{color:#FFD700;font-weight:700;font-size:15px;margin-top:6px}

/* 不用 gap：部分 Android WebView 对 flex gap 支持差，间距会失效；改用 margin */
.popup-dials{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;-webkit-box-align:center;-webkit-align-items:center;align-items:center;padding:12px 12px;overflow:hidden}
.popup-dial{-webkit-flex-shrink:0;flex-shrink:0;width:44px;height:44px;border-radius:10px;overflow:hidden;border:1.5px solid #FFD70044;animation:dialFloat 2s ease-in-out infinite}
.popup-dial+.popup-dial{margin-left:16px}
.popup-dial:nth-child(2){animation-delay:.3s}
.popup-dial:nth-child(3){animation-delay:.6s}
.popup-dial:nth-child(4){animation-delay:.9s}
.popup-dial:nth-child(5){animation-delay:1.2s}
@keyframes dialFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.popup-dial img{width:100%;height:100%;object-fit:cover}

.popup-bonus{text-align:center;padding:6px;font-size:11px;color:#FFD700}

.popup-btns{display:-webkit-box;display:-webkit-flex;display:flex;padding:12px 16px 20px}
.btn-skip{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:0;height:44px;border:1px solid #555;border-radius:22px;background:transparent;color:#999;font-size:14px;cursor:pointer}
.btn-go{-webkit-box-flex:1.2;-webkit-flex:1.2;flex:1.2;min-width:0;margin-left:20px;height:44px;border:none;border-radius:22px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#1a0a2e;font-size:15px;font-weight:700;cursor:pointer;position:relative;overflow:hidden}
.btn-go .shimmer{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,#ffffff44,transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{left:-100%}100%{left:100%}}

.close-btn{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#888;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* 缩小浮标：整图 assets（爆款表盘 / 盲盒抽不停 已包含在图中） */
.mini-fab{
  position:fixed;top:0;right:0;bottom:0;left:0;
  border-radius:50%;
  overflow:hidden;
  background:transparent;
  box-shadow:0 4px 14px rgba(60,40,120,.4);
  display:none;align-items:center;justify-content:center;
  cursor:pointer;z-index:2147483647;
  box-sizing:border-box;padding:0;
}
.mini-fab-img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}
</style>
</head>
<body>

<!-- 全屏弹窗 -->
<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-header">
      <button class="close-btn" onclick="minimize()">✕</button>
      <div class="popup-tag">限时活动</div>
      <div class="popup-title">表盘盲盒上线啦</div>
      <div class="popup-desc">精选付费表盘随机抽取<br>每次必得新款，集齐5款送限定！</div>
      <div class="popup-price">限时盲盒活动</div>
    </div>

    <div class="popup-dials" id="dialPreview">
      <div class="popup-dial"><div style="width:100%;height:100%;background:#2a1a4e;display:flex;align-items:center;justify-content:center;font-size:10px;color:#FFD700">?</div></div>
      <div class="popup-dial"><div style="width:100%;height:100%;background:#2a1a4e;display:flex;align-items:center;justify-content:center;font-size:10px;color:#FFD700">?</div></div>
      <div class="popup-dial"><div style="width:100%;height:100%;background:#2a1a4e;display:flex;align-items:center;justify-content:center;font-size:10px;color:#FFD700">?</div></div>
      <div class="popup-dial"><div style="width:100%;height:100%;background:#2a1a4e;display:flex;align-items:center;justify-content:center;font-size:10px;color:#FFD700">?</div></div>
      <div class="popup-dial"><div style="width:100%;height:100%;background:#2a1a4e;display:flex;align-items:center;justify-content:center;font-size:10px;color:#FFD700">?</div></div>
    </div>
    <div class="popup-bonus">🎁 集齐5款额外赠送限定表盘</div>

    <div class="popup-btns">
      <button class="btn-skip" onclick="minimize()">暂不参与</button>
      <button class="btn-go" onclick="goBlindBox()">
        <span class="shimmer"></span>
        去看看 ›
      </button>
    </div>
  </div>
</div>

<!-- 缩小浮标（整图，与 blind_box_popup.html 同目录：blind_box_mini_fab.png） -->
<div class="mini-fab" id="miniFab" onclick="expand()">
  <img class="mini-fab-img" src="blind_box_mini_fab.png" alt="爆款表盘 盲盒抽不停">
</div>

<script>
function minimize() {
  document.getElementById('overlay').classList.add('hidden');
  var mf = document.getElementById('miniFab');
  mf.style.display = 'flex';
  mf.style.opacity = '';
  mf.style.visibility = '';
  mf.style.pointerEvents = '';
  if (window.blindBoxPopup && window.blindBoxPopup.onMinimize) {
    window.blindBoxPopup.onMinimize();
  }
}

function expand() {
  // 方案 A：立刻隐藏浮标，避免 WebView 从小窗拉成全屏时整图随视口变大造成漂移感
  var mf = document.getElementById('miniFab');
  mf.style.opacity = '0';
  mf.style.visibility = 'hidden';
  mf.style.pointerEvents = 'none';
  // 等原生把 WebView 扩到全屏后，再由原生回调 revealBlindBoxOverlay() 显示弹层
  if (window.blindBoxPopup && window.blindBoxPopup.onExpand) {
    window.blindBoxPopup.onExpand();
  }
}

function revealBlindBoxOverlay() {
  document.getElementById('miniFab').style.display = 'none';
  document.getElementById('overlay').classList.remove('hidden');
}

// 如果 URL 带 #minimized，自动缩小
if (window.location.hash === '#minimized') {
  minimize();
}

function goBlindBox() {
  minimize();
  if (window.blindBoxPopup && window.blindBoxPopup.go) {
    window.blindBoxPopup.go();
  }
}
</script>
</body>
</html>
